services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aif_rag_db
    environment:
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpassword
      POSTGRES_DB: aif_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d aif_rag"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: